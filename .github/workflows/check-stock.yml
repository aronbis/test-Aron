name: Check p-bandai stock

on:
  schedule:
    - cron: "*/10 * * * *"   # filet de sécurité, cron-job.org gère la vraie fréquence
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer une notification de test sur Discord"
        type: boolean
        default: false

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # évite qu'un run bloqué embouteille la file d'attente
    # Image Docker avec Chromium et ses dépendances déjà installés.
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Cache des paquets pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-playwright1610

      - run: pip install requests playwright==1.61.0

      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python check_stock.py

      - name: Sauvegarder l'état pour la prochaine exécution
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "update state"
          # En cas de push concurrent, on rebase et on retente.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          git push
