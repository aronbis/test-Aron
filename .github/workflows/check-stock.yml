name: Check p-bandai stock

on:
  schedule:
    - cron: "*/10 * * * *"   # filet de sécurité, cron-job.org gère la vraie fréquence
  workflow_dispatch:          # permet aussi de lancer manuellement
    inputs:
      test_notification:
        description: "Envoyer une notification de test sur Discord"
        type: boolean
        default: false

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    # Image Docker avec Chromium et toutes ses dépendances déjà installés :
    # plus besoin de tout réinstaller à chaque run (c'était la cause des
    # lenteurs variables).
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble
    steps:
      - uses: actions/checkout@v4

      - run: pip install requests playwright==1.61.0

      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python check_stock.py

      - name: Sauvegarder l'état pour la prochaine exécution
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
