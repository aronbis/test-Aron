name: Check Stock (Hikaru + King Jouet + Fnac + Smyths + Cultura)
# Déclenché manuellement uniquement, via l'API workflow_dispatch
# appelée par cron-job.org (pas de "schedule:" ici : le cron GitHub natif
# n'est pas assez fiable pour du monitoring de stock).
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Envoyer une alerte Discord de TEST (sans vérifier le vrai stock)"
        required: false
        type: boolean
        default: false
      report:
        description: "Envoyer l'inventaire Discord de tout le One Piece TCG commandable maintenant"
        required: false
        type: boolean
        default: false
      diagnose:
        description: "Diagnostiquer la configuration du bot Discord (n'envoie rien)"
        required: false
        type: boolean
        default: false
permissions:
  contents: write  # nécessaire pour committer state_stock.json
# cron-job.org peut déclencher un run alors que le précédent tourne encore :
# on les sérialise pour éviter deux jobs qui committent state_stock.json en
# même temps (conflit de push / état écrasé).
concurrency:
  group: check-stock
  cancel-in-progress: false
jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Check stock (Hikaru + King Jouet + Fnac + Smyths + Cultura)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # Facultatifs : sans eux, la commande "!stock" dans Discord est
          # simplement inactive, la surveillance tourne normalement.
          # Marche à suivre dans DISCORD.md.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
          REPORT: ${{ github.event.inputs.report }}
          DIAGNOSE: ${{ github.event.inputs.diagnose }}
          # Cultura, Fnac et Smyths refusent les IP des runners GitHub : les
          # interroger d'ici ne produit que des "indéterminé". Cultura est repris
          # par la tâche launchd du Mac (voir local/README.md).
          # L'inventaire à la demande, lui, les interroge quand même : il doit
          # dire explicitement quelles boutiques n'ont pas pu être vérifiées.
          # Attention : en syntaxe GitHub, "cond && '' || autre" renvoie toujours
          # "autre", la chaîne vide étant falsy. Les deux branches doivent donc
          # être non vides — d'où la liste complète écrite en toutes lettres.
          # "hikaru_one_piece" (tout le catalogue Hikaru) est volontairement absent
          # des deux listes : seule la promo ONE PIECE DAY'26 y est suivie.
          MONITOR_SITES: ${{ github.event.inputs.report == 'true' && 'hikaru,king_jouet,fnac,smyths,cultura,leclerc,granderecre,orchestra' || 'hikaru,king_jouet,leclerc,granderecre,orchestra' }}
        run: python monitor_hikaru_once.py
      # always() : même si l'étape précédente sort en erreur (un site cassé),
      # l'état des sites qui ont bien répondu doit être sauvegardé.
      - name: Commit updated state (si changement)
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f state_stock.json ]; then
            echo "Rien à committer pour l'instant."
            exit 0
          fi
          git add state_stock.json
          if git diff --cached --quiet; then
            echo "Pas de changement d'état, rien à committer."
            exit 0
          fi
          git commit -m "update stock state [skip ci]"
          # Rebase avant push : le run précédent a pu pousser entre-temps.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
